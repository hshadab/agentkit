<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Circle Gateway API - Advanced Developer Card Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0B0E1C;
            --bg-secondary: #1A1F3A;
            --accent-primary: #00FFAA;
            --accent-secondary: #00D4FF;
            --text-primary: #FFFFFF;
            --text-secondary: #B8BCC8;
            --panel-bg: rgba(26, 31, 58, 0.95);
        }

        body.light-mode {
            --bg-primary: #F5F7FA;
            --bg-secondary: #FFFFFF;
            --accent-primary: #00B57C;
            --accent-secondary: #0099CC;
            --text-primary: #1A1F3A;
            --text-secondary: #5A6270;
            --panel-bg: rgba(255, 255, 255, 0.95);
        }

        body.light-mode .node-text { fill: #1A1F3A; }
        body.light-mode .node-bg { fill: #FFFFFF; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            overflow: hidden;
            position: relative;
            height: 100vh;
            color: var(--text-primary);
        }

        /* Animated background particles */
        .bg-animation { position: fixed; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(0, 255, 170, 0.3); border-radius: 50%; animation: float 20s infinite linear; }

        @keyframes float {
            from { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            to { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* Flow animation */
        @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
        .flow-animation { stroke-dasharray: 5, 5; animation: flow 2s linear infinite; }

        /* Header */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 170, 0.2);
            padding: 15px 30px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo {
            font-size: 24px; font-weight: bold;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            display: flex; align-items: center; gap: 10px;
        }

        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        .nav-btn {
            padding: 8px 16px;
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid rgba(0, 255, 170, 0.3);
            border-radius: 8px;
            color: var(--accent-primary);
            cursor: pointer; transition: all 0.3s ease; font-size: 13px;
        }
        .nav-btn:hover { background: rgba(0, 255, 170, 0.2); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 170, 0.3); }
        .nav-btn.active { background: var(--accent-primary); color: var(--bg-primary); }

        /* Search */
        .search-container { position: relative; margin: 0 20px; }
        .search-input {
            padding: 8px 35px 8px 15px;
            background: rgba(0, 255, 170, 0.05);
            border: 1px solid rgba(0, 255, 170, 0.2);
            border-radius: 20px; color: var(--text-primary);
            width: 250px; transition: all 0.3s ease;
        }
        .search-input:focus { outline: none; width: 350px; background: rgba(0, 255, 170, 0.1); border-color: var(--accent-primary); }
        .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--accent-primary); }

        /* Command Palette */
        .command-palette {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 600px; max-height: 400px;
            background: var(--panel-bg); border: 1px solid var(--accent-primary);
            border-radius: 12px; padding: 20px; z-index: 2000; display: none; overflow-y: auto;
        }
        .command-palette.active { display: block; }
        .command-item { padding: 10px; margin: 5px 0; background: rgba(0, 255, 170, 0.05); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .command-item:hover { background: rgba(0, 255, 170, 0.2); }

        /* SVG */
        #mindmap { width: 100%; height: 100vh; position: relative; z-index: 1; }

        /* Node styles */
        .node { cursor: pointer; }
        .node-rect { stroke-width: 2; transition: all 0.3s ease; }
        .node:hover .node-rect { stroke-width: 3; filter: drop-shadow(0 0 20px currentColor); }
        .node-text { fill: white; font-size: 9px; text-anchor: middle; pointer-events: none; font-weight: 600; }
        .node-subtext { fill: var(--text-secondary); font-size: 8px; text-anchor: middle; pointer-events: none; }
        .center-node .node-text { font-size: 12px; font-weight: bold; }
        .main-node .node-text { font-size: 10px; font-weight: 600; }

        .status-indicator { fill: #00FF00; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

        /* Links */
        .link { fill: none; stroke-opacity: 0.9; stroke-width: 2; transition: all 0.3s ease; }
        .link.highlighted { stroke-opacity: 1.0; stroke-width: 4; }

        /* Info Panel */
        .info-panel {
            position: fixed; right: -450px; top: 70px; bottom: 20px; width: 430px;
            background: var(--panel-bg); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 170, 0.2); border-radius: 16px; padding: 25px;
            transition: right 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);
            z-index: 999; overflow-y: auto; box-shadow: -10px 0 40px rgba(0,0,0,0.3);
        }
        .info-panel.active { right: 20px; }
        .info-panel h2 {
            color: var(--accent-primary); margin-bottom: 15px; font-size: 24px;
            border-bottom: 2px solid rgba(0, 255, 170, 0.3); padding-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-panel h3 { color: var(--accent-secondary); margin: 20px 0 10px; font-size: 16px; }
        .info-panel p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 15px; }
        .info-panel ul { list-style: none; padding-left: 0; }
        .info-panel li { color: var(--text-secondary); padding: 8px 0 8px 20px; position: relative; }
        .info-panel li:before { content: "▸"; position: absolute; left: 0; color: var(--accent-primary); }
        .info-panel a { color: var(--accent-secondary); text-decoration: none; border-bottom: 1px dotted var(--accent-secondary); transition: all 0.3s ease; }
        .info-panel a:hover { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin: 15px 0; border-bottom: 1px solid rgba(0,255,170,0.2); }
        .tab { padding: 8px 15px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .tab.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
        .tab-content { display: none; margin-top: 15px; }
        .tab-content.active { display: block; }

        /* Code block */
        .code-block {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 170, 0.2);
            border-radius: 8px; padding: 15px; margin: 15px 0;
            font-family: 'Courier New', monospace; font-size: 12px; color: var(--accent-primary);
            overflow-x: auto; position: relative;
        }
        .code-block pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
        .copy-btn {
            position: absolute; top: 10px; right: 10px; padding: 5px 10px;
            background: rgba(0, 255, 170, 0.2); border: 1px solid var(--accent-primary);
            border-radius: 4px; color: var(--accent-primary); cursor: pointer; font-size: 11px; transition: all 0.3s ease;
        }
        .copy-btn:hover { background: var(--accent-primary); color: var(--bg-primary); }

        /* Status badges */
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin: 0 5px; }
        .status-badge.live { background: rgba(0,255,0,0.2); color: #00FF00; }
        .status-badge.testnet { background: rgba(255,255,0,0.2); color: #FFFF00; }

        /* Contract addresses */
        .contract-address { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(0, 255, 170, 0.05); border-radius: 8px; margin: 10px 0; }
        .contract-address code { font-family: 'Courier New', monospace; font-size: 11px; color: var(--accent-secondary); }

        /* API Tester */
        .api-tester { margin: 20px 0; padding: 15px; background: rgba(0,255,170,0.05); border-radius: 8px; }
        .api-input { width: 100%; padding: 8px; margin: 10px 0; background: rgba(0,0,0,0.2); border: 1px solid rgba(0,255,170,0.3); border-radius: 4px; color: var(--text-primary); }
        .api-button {
            padding: 10px 20px; background: var(--accent-primary); color: var(--bg-primary);
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s ease;
        }
        .api-button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,170,0.3); }
        .api-response { margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 4px; font-family: 'Courier New', monospace; font-size: 11px; color: var(--accent-primary); max-height: 200px; overflow-y: auto; white-space: pre-wrap; }

        /* Cost Calculator */
        .calculator { padding: 15px; background: rgba(0,255,170,0.05); border-radius: 8px; margin: 15px 0; }
        .calculator-input { display: flex; align-items: center; margin: 10px 0; }
        .calculator-input label { flex: 1; color: var(--text-secondary); font-size: 13px; }
        .calculator-input input {
            width: 120px; padding: 5px; background: rgba(0,0,0,0.2);
            border: 1px solid rgba(0,255,170,0.3); border-radius: 4px; color: var(--text-primary); text-align: right;
        }
        .calculator-result { margin-top: 15px; padding: 10px; background: rgba(0,255,170,0.1); border-radius: 4px; text-align: center; font-size: 18px; font-weight: bold; color: var(--accent-primary); }

        /* Tooltip */
        .tooltip {
            position: absolute; background: var(--panel-bg);
            border: 1px solid rgba(0,255,170,0.3); border-radius: 8px; padding: 10px 15px;
            color: var(--text-primary); font-size: 13px; pointer-events: none; opacity: 0;
            transition: opacity 0.3s ease; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.3); max-width: 250px;
        }
        .tooltip.show { opacity: 1; }
        .tooltip .method-signature { font-family: 'Courier New', monospace; font-size: 11px; color: var(--accent-secondary); margin-top: 5px; }

        /* Progress Tracker */
        .progress-tracker { margin: 20px 0; }
        .progress-step { display: flex; align-items: center; margin: 10px 0; }
        .progress-step .step-number {
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(0,255,170,0.2); border: 2px solid var(--accent-primary);
            display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px;
        }
        .progress-step.completed .step-number { background: var(--accent-primary); color: var(--bg-primary); }
        .progress-step .step-content { flex: 1; }

        /* Filter buttons */
        .filter-container {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 100; background: var(--panel-bg);
            padding: 15px; border-radius: 12px; border: 1px solid rgba(0,255,170,0.2);
        }
        .filter-btn {
            padding: 8px 15px; background: rgba(0,255,170,0.1);
            border: 1px solid rgba(0,255,170,0.3); border-radius: 20px;
            color: var(--accent-primary); cursor: pointer; font-size: 12px; transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active { background: var(--accent-primary); color: var(--bg-primary); }

        /* Tutorial overlay */
        .tutorial-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none; }
        .tutorial-overlay.active { display: block; }
        .tutorial-spotlight { position: absolute; border: 3px solid var(--accent-primary); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.8); transition: all 0.5s ease; }
        .tutorial-tooltip { position: absolute; background: var(--panel-bg); border: 2px solid var(--accent-primary); border-radius: 12px; padding: 20px; max-width: 350px; color: var(--text-primary); }
        .tutorial-tooltip h3 { color: var(--accent-primary); margin-bottom: 10px; }
        .tutorial-nav { display: flex; justify-content: space-between; margin-top: 15px; }
        .tutorial-btn { padding: 8px 15px; background: var(--accent-primary); color: var(--bg-primary); border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Loader */
        .loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; }
        .loader-circle { width: 60px; height: 60px; border: 3px solid rgba(0, 255, 170, 0.1); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .info-panel { width: calc(100% - 40px); right: -100%; }
            .info-panel.active { right: 20px; left: 20px; }
            .filter-container { bottom: 10px; padding: 10px; flex-wrap: wrap; }
            .search-input:focus { width: 200px; }
        }

        /* Close button */
        .close-panel {
            width: 24px; height: 24px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; color: var(--text-primary);
        }
        .close-panel:hover { background: rgba(255, 0, 100, 0.3); transform: rotate(90deg); }
    </style>
</head>
<body>
    <!-- Background animation -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

        <div class="search-container">

        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <!-- Loading -->

        // Background particles
        function createParticles() {
            const bgAnimation = document.getElementById('bgAnimation');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                bgAnimation.appendChild(particle);
            }
        }

        // D3 setup
        svg = d3.select("#mindmap").attr("width", width).attr("height", height);
        const g = svg.append("g");

        // Zoom
        zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);

        const centerX = width / 2;
        const centerY = height / 2;

        function prepareData(data) {
            const nodes = [];
            const links = [];

            const centerNode = { id: 'center', ...data, x: centerX, y: centerY, level: 0, width: 120, height: 80 };
            nodes.push(centerNode);

            if (data.children) {
                const radius = 280;
                data.children.forEach((child, i) => {
                    const angle = (i / data.children.length) * Math.PI * 2 - Math.PI / 2;
                    const childNode = {
                        id: 'main-' + i, ...child,
                        x: centerX + radius * Math.cos(angle),
                        y: centerY + radius * Math.sin(angle),
                        level: 1, width: 100, height: 70
                    };
                    nodes.push(childNode);
                    links.push({ source: centerNode, target: childNode });

                    if (child.children) {
                        const subRadius = 140;
                        child.children.forEach((subchild, j) => {
                            const subAngle = (j / child.children.length) * Math.PI * 2 - Math.PI / 2;
                            const subNode = {
                                id: `sub-${i}-${j}`, ...subchild,
                                x: childNode.x + subRadius * Math.cos(subAngle),
                                y: childNode.y + subRadius * Math.sin(subAngle),
                                level: 2, width: 80, height: 60
                            };
                            nodes.push(subNode);
                            links.push({ source: childNode, target: subNode });
                        });
                    }
                });
            }
            return { nodes, links };
        }

        graphData = prepareData(data);

        // Links
        link = g.append("g")
            .selectAll(".link")
            .data(graphData.links)
            .join("line")
            .attr("class", "link")
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y)
            .attr("stroke", "#00FFAA")
            .attr("stroke-width", 2);

        // Nodes
        node = g.append("g")
            .selectAll(".node")
            .data(graphData.nodes)
            .join("g")
            .attr("class", d => d.level === 0 ? "node center-node" : d.level === 1 ? "node main-node" : "node")
            .attr("transform", d => `translate(${d.x},${d.y})`);

        // Drag
        const drag = d3.drag()
            .on("start", function () { d3.select(this).classed("dragging", true); svg.style("cursor", "grabbing"); })
            .on("drag", function (event, d) {
                if (!d) return;
                d.x = event.x; d.y = event.y;
                d3.select(this).attr("transform", `translate(${d.x},${d.y})`);
                link.filter(l => l && l.source === d).attr("x1", d.x).attr("y1", d.y);
                link.filter(l => l && l.target === d).attr("x2", d.x).attr("y2", d.y);
            })
            .on("end", function (event, d) {
                d3.select(this).classed("dragging", false);
                svg.style("cursor", "default");
                d3.select(this).transition().duration(200).attr("transform", `translate(${d.x},${d.y})`);
            });
        node.call(drag);

        // Gradients
        const defs = svg.append("defs");
        graphData.nodes.forEach(d => {
            const gradient = defs.append("linearGradient")

            gradient.append("stop").attr("offset", "50%").attr("stop-color", d.color).attr("stop-opacity", 0.15);
            gradient.append("stop").attr("offset", "100%").attr("stop-color", d.color).attr("stop-opacity", 0.08);

        // Tooltip
        const tooltip = document.getElementById('tooltip');

            if (d.description && !event.currentTarget.classList.contains("dragging")) {

        // Info panel

            const panel = document.getElementById('infoPanel');

                    Object.entries(nodeData.details.metrics).forEach(([key, value]) => {

                if (nodeData.details.contracts) {
                    html += '<h3>Contract Addresses</h3>';
                    window.currentContracts = {};
                    let idx = 0;
                    Object.entries(nodeData.details.contracts).forEach(([chain, address]) => {
                        if (typeof address === 'object') {

                        const displayCode = codeText.replace(/\\n/g, '\n').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        // Utility
        function copyToClipboard(event) {
            if (!navigator.clipboard) { console.warn('Clipboard API not available'); return; }
            let textToCopy = '';
            const btn = event.target;
            const lang = btn.getAttribute('data-code-lang');
            if (lang && window.currentCodeExamples?.[lang]) textToCopy = window.currentCodeExamples[lang];
            const contractKey = btn.getAttribute('data-contract-key');
            if (contractKey && window.currentContracts?.[contractKey]) textToCopy = window.currentContracts[contractKey];
            if (!textToCopy) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const original = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = original; }, 2000);
            }).catch(err => console.error('Failed to copy:', err));
        }

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (evt && evt.target) evt.target.classList.add('active');
            const tabContent = document.getElementById('tab-' + lang);
            if (tabContent) tabContent.classList.add('active');
        }

            };
            responseDiv.style.display = 'block';
            responseDiv.innerHTML = '<strong>Response:</strong><br>' + JSON.stringify(responseData, null, 2);
        }

        function calculateCost() {
            const volumeEl = document.getElementById('calcVolume');
            const chainsEl = document.getElementById('calcChains');
            const txnsEl = document.getElementById('calcTxns');
            if (!volumeEl || !chainsEl || !txnsEl) return;

            const volume = parseFloat(volumeEl.value || 10000);
            const chains = parseFloat(chainsEl.value || 3);
            const txns = parseFloat(txnsEl.value || 100);

            const baseFee = 0.001; // 0.1%
            const perTxnFee = 0.50;
            const chainFee = 0.10;

            const totalCost = (volume * baseFee) + (txns * perTxnFee) + (chains * chainFee * txns);
            const resultDiv = document.getElementById('calcResult');
            if (resultDiv) resultDiv.textContent = 'Estimated Daily Cost: $' + totalCost.toFixed(2);
        }

        // Search
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                if (node) {
                    node.style('opacity', d => {
                        if (!searchTerm) return 1;
                        return d.name.toLowerCase().includes(searchTerm) || d.description?.toLowerCase().includes(searchTerm) ? 1 : 0.2;
                    });
                }
                if (link) {
                    link.style('opacity', d => {
                        if (!searchTerm) return 0.9;
                        return (d.source.name.toLowerCase().includes(searchTerm) || d.target.name.toLowerCase().includes(searchTerm)) ? 0.9 : 0.1;
                    });
                }
            });
        }

        // Filters
        function filterNodes(filterType, evt) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) evt.target.classList.add('active');

            if (node) {
                node.style('opacity', d => {
                    if (filterType === 'all') return 1;
                    if (filterType === 'technical' && (d.category === 'technical' || d.level === 0)) return 1;
                    if (filterType === 'business' && (d.category === 'business' || d.level === 0)) return 1;
                    if (filterType === 'chains' && (d.name === 'Chains' || d.name === 'ETH' || d.name === 'L2s' || d.name === 'Alt L1s')) return 1;
                    if (filterType === 'integration' && (d.name === 'Flow' || d.name === 'Dev' || d.name === 'APIs' || d.level === 0)) return 1;
                    return 0.2;
                });
            }
            if (link) link.style('opacity', 0.2);
        }

        // Export globals
        window.copyToClipboard = copyToClipboard;
        window.switchTab = switchTab;
        window.testAPI = testAPI;
        window.calculateCost = calculateCost;
        window.filterNodes = filterNodes;
        window.toggleTheme = toggleTheme;
        window.toggleAnimation = toggleAnimation;
        window.toggleTutorial = toggleTutorial;
        window.toggleCommandPalette = toggleCommandPalette;
        window.nextTutorialStep = nextTutorialStep;
        window.previousTutorialStep = previousTutorialStep;
        window.exportDiagram = exportDiagram;
        window.resetView = resetView;
        window.closeInfoPanel = closeInfoPanel;
        window.showTutorialStep = showTutorialStep;
        window.openDocs = openDocs;

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.classList.toggle('light-mode');
        }

        function toggleAnimation() {
            if (!node || !link) return;
            animationEnabled = !animationEnabled;
            if (animationEnabled) {
                link.classed('flow-animation', true);
                (function animateNodes() {
                    if (!animationEnabled || !node) return;
                    node.transition()
                        .duration(2000)
                        .attr('transform', d => {
                            const offset = Math.sin(Date.now() * 0.001 + d.level) * 5;
                            return `translate(${d.x},${d.y + offset})`;
                        })
                        .on('end', () => { if (animationEnabled) animateNodes(); });
                })();
            } else {
                link.classed('flow-animation', false);
                node.interrupt();
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            }
        }

        // Tutorial
        const tutorialSteps = [
            { target: '.center-node', title: 'Gateway Core', content: 'This is the central hub of Circle Gateway API.' },
            { target: '.main-node', title: 'Main Categories', content: 'These are the main functional areas of Gateway.' },
            { target: '.search-container', title: 'Search', content: 'Search for specific nodes, methods, or chains.' },
            { target: '.filter-container', title: 'Filters', content: 'Filter nodes by category to focus on specific areas.' },
            { target: '.nav-buttons', title: 'Tools', content: 'Access various tools and features here.' },
            { target: '.info-panel', title: 'Details Panel', content: 'Click any node to see detailed information.' },
            { target: '#mindmap', title: 'Interactive Map', content: 'Drag nodes, zoom, and explore the ecosystem!' }
        ];

        function toggleTutorial() {
            const overlay = document.getElementById('tutorialOverlay');
            if (overlay.classList.contains('active')) {
                overlay.classList.remove('active'); tutorialStep = 0;
            } else {
                overlay.classList.add('active'); tutorialStep = 0; showTutorialStep();
            }
        }

        function showTutorialStep() {
            if (tutorialStep >= tutorialSteps.length) { document.getElementById('tutorialOverlay').classList.remove('active'); return; }
            const step = tutorialSteps[tutorialStep];
            const target = document.querySelector(step.target);
            if (target) {
                const rect = target.getBoundingClientRect();
                const spotlight = document.getElementById('tutorialSpotlight');
                spotlight.style.left = (rect.left - 10) + 'px';
                spotlight.style.top = (rect.top - 10) + 'px';
                spotlight.style.width = (rect.width + 20) + 'px';
                spotlight.style.height = (rect.height + 20) + 'px';
            }
            document.getElementById('tutorialTitle').textContent = step.title;
            document.getElementById('tutorialContent').textContent = step.content;
            document.getElementById('tutorialProgress').textContent = (tutorialStep + 1) + ' / ' + tutorialSteps.length;
        }

        function nextTutorialStep() { tutorialStep++; showTutorialStep(); }
        function previousTutorialStep() { tutorialStep = Math.max(0, tutorialStep - 1); showTutorialStep(); }

        // Command palette
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); toggleCommandPalette(); }
            if (e.key === 'Escape') {
                closeInfoPanel();
                const palette = document.getElementById('commandPalette');
                if (palette) palette.classList.remove('active');
            }
        });

        function toggleCommandPalette() {
            const palette = document.getElementById('commandPalette');
            if (!palette) return;
            palette.classList.toggle('active');
            if (palette.classList.contains('active')) {
                const commandInput = document.getElementById('commandInput');
                if (commandInput) commandInput.focus();
                populateCommands();
            }
        }

        function populateCommands() {
            const commands = [
                { name: 'Reset View', action: 'resetView' },
                { name: 'Toggle Theme', action: 'toggleTheme' },
                { name: 'Toggle Animation', action: 'toggleAnimation' },
                { name: 'Start Tutorial', action: 'toggleTutorial' },
                { name: 'Export Diagram', action: 'exportDiagram' },
                { name: 'Show All Nodes', action: 'filterNodes', param: 'all' },
                { name: 'Show Technical Nodes', action: 'filterNodes', param: 'technical' },
                { name: 'Show Business Nodes', action: 'filterNodes', param: 'business' },
                { name: 'Open Documentation', action: 'openDocs' }
            ];
            const list = document.getElementById('commandList');
            if (!list) return;
            list.innerHTML = commands.map(cmd => {
                const onclick = cmd.param ? `window.${cmd.action}('${cmd.param}', event)` : `window.${cmd.action}()`;
                return `<div class="command-item" onclick="${onclick}; document.getElementById('commandPalette').classList.remove('active');">${cmd.name}</div>`;
            }).join('');
        }

        function openDocs() { window.open('https://developers.circle.com/gateway', '_blank'); }

        // Export diagram
        function exportDiagram() {
            const svgData = document.getElementById('mindmap').outerHTML;
            const blob = new Blob([svgData], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'circle-gateway-mindmap.svg'; a.click();
        }

        // Reset view
        function resetView() {
            if (!svg || !graphData || !node || !link) return;
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);

            const radius = 250;
            graphData.nodes.forEach((d, i) => {
                if (d.level === 0) { d.x = centerX; d.y = centerY; }
                else if (d.level === 1) {
                    const angle = ((i - 1) / 7) * Math.PI * 2 - Math.PI / 2;
                    d.x = centerX + radius * Math.cos(angle);
                    d.y = centerY + radius * Math.sin(angle);
                }
            });

            node.transition().duration(750).attr("transform", d => `translate(${d.x},${d.y})`);
            link.transition().duration(750)
                .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        }

        // Init
        createParticles();

        // Delegated copy buttons
        document.addEventListener('DOMContentLoaded', function () {
            document.addEventListener('click', function (e) {
                if (e.target && e.target.classList.contains('copy-btn')) copyToClipboard(e);
            });
        });

        // Hide loader
        setTimeout(() => { const loaderEl = document.getElementById('loader'); if (loaderEl) loaderEl.style.display = 'none'; }, 1000);

        // Initial zoom
        const initialScale = 0.8;
        setTimeout(() => { svg.call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(initialScale)); }, 100);

        // Welcome
        setTimeout(() => {
            const welcomePanel = document.getElementById('infoPanel');
            const panelTitle = document.getElementById('panelTitle');
            const panelContent = document.getElementById('infoPanelContent');
            if (welcomePanel && panelTitle && panelContent) {
                panelTitle.innerHTML = '👋 Welcome to Gateway Explorer';
                panelContent.innerHTML =
                    '<p>Welcome to the Circle Gateway API Interactive Mind Map!</p>' +
                    '<h3>Quick Start:</h3>' +
                    '<ul>' +
                        '<li>Click any card to explore details</li>' +
                        '<li>Drag cards to reorganize</li>' +
                        '<li>Use filters at the bottom to focus</li>' +
                        '<li>Press Cmd+K for command palette</li>' +
                        '<li>Try the Tutorial for a guided tour</li>' +
                    '</ul>' +
                    '<h3>New Features:</h3>' +
                    '<ul>' +
                        '<li>📇 Card-based design with more info</li>' +
                        '<li>✨ Live status indicators</li>' +
                        '<li>📊 API testing interface</li>' +
                        '<li>💰 Cost calculator</li>' +
                        '<li>🎨 Dark/Light themes</li>' +
                        '<li>🔍 Smart search</li>' +
                        '<li>📱 Multi-language code examples</li>' +
                    '</ul>' +
                    '<button class="api-button" onclick="window.toggleTutorial(); window.closeInfoPanel();" style="margin-top: 20px;">Start Tutorial</button>';
                welcomePanel.classList.add('active');
            }
        }, 1500);
    </script>
</body>
</html>
