<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            color: #ffffff;
            display: flex;
            justify-content: center;

            height: 100vh;

        }

            color: #00FFAA;
            text-decoration: none;
            font-size: 18px;

        }
        a:hover {

            border-color: #00D4FF;
        }
