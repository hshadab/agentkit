<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Gateway Visualization - Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=/agentkit/circle/gateway/">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0B0E1C 0%, #1A1F3A 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .redirect-message {
            text-align: center;
            padding: 40px;
            background: rgba(26, 31, 58, 0.95);
            border-radius: 20px;
            border: 2px solid #00FFAA;
            box-shadow: 0 20px 60px rgba(0, 255, 170, 0.3);
        }
        h1 {
            background: linear-gradient(135deg, #00FFAA 0%, #00D4FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        a {
            color: #00FFAA;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid #00FFAA;
            padding-bottom: 2px;
        }
        a:hover {
            color: #00D4FF;
            border-color: #00D4FF;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 3px solid rgba(0, 255, 170, 0.3);
            border-top-color: #00FFAA;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>Circle Gateway Visualization</h1>
        <div class="spinner"></div>
        <p>Redirecting to the new location...</p>
        <p style="margin-top: 20px;">
            If you're not redirected automatically, 
            <a href="/agentkit/circle/gateway/">click here</a>
        </p>
    </div>
    <script>
        // Redirect immediately
        window.location.href = '/agentkit/circle/gateway/';
    </script>
</body>
</html>
