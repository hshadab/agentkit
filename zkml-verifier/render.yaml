services:
  # Main zkML Verifier Backend (API)
  - type: web
    name: zkml-verifier-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 9100
      - key: NODE_ENV
        value: production
    healthCheckPath: /health

  # UI Frontend (Static + Server)
  - type: web
    name: zkml-verifier-ui
    env: node
    plan: starter
    buildCommand: cd ui && npm install
    startCommand: cd ui && node server.js
    envVars:
      - key: PORT
        value: 9101
      - key: API_URL
        value: https://zkml-verifier-api.onrender.com
    healthCheckPath: /
