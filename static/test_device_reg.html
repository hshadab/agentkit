<!DOCTYPE html>
<html>
<head>
    <title>Test Device Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="./parsers/nova/nova-proof-formatter.js"></script>
    <script src="./js/blockchain/iotex-device-verifier.js?v=20250816-4"></script>
</head>
<body>
    <h1>Device Registration Test</h1>
    <button id="testBtn">Test Device Registration</button>
    <div id="result"></div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                console.log('Ethers version:', ethers.version);
                console.log('Testing parseEther:', ethers.utils.parseEther('0.01'));
                
                // Test the device verifier
                const verifier = new IoTeXDeviceVerifier();
                console.log('Verifier created');
                
                // Test device registration
                const result = await verifier.registerDevice('TEST_SENSOR');
                console.log('Registration result:', result);
                
                resultDiv.innerHTML = `
                    <p>Success: ${result.success}</p>
                    <p>Device ID: ${result.deviceId}</p>
                    <p>Error: ${result.error || 'None'}</p>
                `;
            } catch (error) {
                console.error('Test error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
