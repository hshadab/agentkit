<!DOCTYPE html>
<html>
<head>
    <title>Device ID Test - Latest</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
        // Force hard refresh by appending current timestamp
        const now = Date.now();
        console.log('Loading with timestamp:', now);
        
        // Clear all storage
        try {
            localStorage.clear();
            sessionStorage.clear();
        } catch(e) {}
    </script>
    
    <!-- Force fresh load of all scripts -->
    <script src="./js/core/utils.js?v=FORCERELOAD"></script>
    <script src="./js/core/config.js?v=FORCERELOAD"></script>
    <script src="./js/ws/websocket-manager.js?v=FORCERELOAD"></script>
    <script src="./js/ui/ui-manager.js?v=FORCERELOAD"></script>
    <script src="./js/ui/transfer-manager.js?v=FORCERELOAD"></script>
    <script src="./js/ui/workflow-manager.js?v=FORCERELOAD"></script>
    <script src="./js/blockchain/iotex-device-verifier.js?v=FORCERELOAD"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4f8d4; }
        .error { background: #f8d4d4; }
    </style>
    
    <script>
        // Replace FORCERELOAD with actual timestamp
        document.addEventListener('DOMContentLoaded', function() {
            const scripts = document.querySelectorAll('script[src*="FORCERELOAD"]');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                newScript.src = script.src.replace('FORCERELOAD', Date.now());
                if (script.type) newScript.type = script.type;
                script.parentNode.replaceChild(newScript, script);
            });
            
            setTimeout(() => {
                window.location.href = '/index.html?v=' + Date.now() + '&test-device-id=true';
            }, 2000);
        });
    </script>
</head>
<body>
    <div class="test">
        <h1>🔧 Device ID Fix - Force Loading Latest Code</h1>
        <p>Forcing reload of all JavaScript files with fresh timestamps...</p>
        <p>Will redirect to main app in 2 seconds with latest device ID fixes.</p>
        <p><strong>Expected Result:</strong> Step 4 should show "Device: SENSOR_xxxxx" instead of "Device: Unknown"</p>
    </div>
    
    <script>
        console.log('Device ID test page loaded at:', new Date().toISOString());
        console.log('All caches cleared, forcing fresh script loads...');
    </script>
</body>
</html>
