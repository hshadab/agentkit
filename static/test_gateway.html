<!DOCTYPE html>
<html>
<head>
    <title>Gateway Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .message { background: #2a2a2a; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { border-left: 4px solid #10b981; }
        .error { border-left: 4px solid #ef4444; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #2563eb; }
        #output { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🧪 Gateway Workflow Test</h1>
    
    <div>
        <button onclick="testGatewayDetection()">Test Gateway Detection</button>
        <button onclick="testGatewayWorkflow()">Test Full Gateway Workflow</button>
        <button onclick="clearOutput()">Clear Output</button>
    </div>
    
    <div id="output"></div>
    
    <script src="./js/ui/gateway-workflow-manager-v2.js"></script>
    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('output').appendChild(div);
            document.getElementById('output').scrollTop = document.getElementById('output').scrollHeight;
        }
        
        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }
        
        function testGatewayDetection() {
            log('🔍 Testing Gateway command detection...', 'info');
            
            const testCommands = [
                'Authorize financial_executor_007 agent for multi-chain Gateway payments',
                'transfer usdc via gateway',
                'send money using gateway',
                'hello world',
                'authorize gateway payments'
            ];
            
            testCommands.forEach(cmd => {
                const isGateway = GatewayWorkflowManager.isGatewayCommand(cmd);
                log(`"${cmd}" → ${isGateway ? '✅ Gateway' : '❌ Not Gateway'}`, isGateway ? 'success' : 'error');
            });
        }
        
        async function testGatewayWorkflow() {
            log('🚀 Testing Gateway workflow initialization...', 'info');
            
            try {
                // Create a mock UI manager
                const mockUIManager = {
                    addMessage: (content, sender) => {
                        log(`📝 UI Message (${sender}): ${typeof content === 'string' ? content : 'HTML Content'}`, 'success');
                    }
                };
                
                // Initialize Gateway workflow manager
                const gatewayManager = new GatewayWorkflowManager(mockUIManager);
                log('✅ Gateway workflow manager initialized', 'success');
                
                // Test command
                const command = 'Authorize financial_executor_007 agent for multi-chain Gateway payments';
                log(`🔄 Processing command: "${command}"`, 'info');
                
                // Check detection
                const isDetected = GatewayWorkflowManager.isGatewayCommand(command);
                log(`🔍 Command detection result: ${isDetected}`, isDetected ? 'success' : 'error');
                
                if (isDetected) {
                    // Try to create workflow
                    log('🎯 Creating Gateway workflow...', 'info');
                    await gatewayManager.createTestWorkflow(command, true); // testnet = true
                    log('✅ Gateway workflow created successfully!', 'success');
                } else {
                    log('❌ Command not detected as Gateway workflow', 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                console.error('Gateway test error:', error);
            }
        }
        
        // Auto-run detection test on load
        window.addEventListener('load', () => {
            log('🧪 Gateway Test Page Loaded', 'success');
            log('📝 Available tests:', 'info');
            log('  - Gateway Detection: Tests command recognition', 'info');
            log('  - Full Workflow: Tests complete Gateway workflow creation', 'info');
        });
    </script>
</body>
</html>
