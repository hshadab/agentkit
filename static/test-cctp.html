<!DOCTYPE html>
<html>
<head>
    <title>CCTP Test - No Cache</title>
    <script>
        // Force no cache
        const timestamp = Date.now();
        console.log('Loading CCTP test with timestamp:', timestamp);
    </script>
</head>
<body>
    <h1>CCTP Debug Test</h1>
    <button id="testButton">Test CCTP</button>
    
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        const cacheTimestamp = Date.now();
        
        // Load main.js with no cache
        const script = document.createElement('script');
        script.type = 'module';
        script.src = `./js/main.js?v=${cacheTimestamp}`;
        document.head.appendChild(script);
        
        document.getElementById('testButton').addEventListener('click', () => {
            alert('Testing CCTP - Check console for loading confirmation');
            
            // Simulate CCTP command
            if (window.executeRealCCTPTransfer) {
                const testCommand = {
                    agent: 'test_agent',
                    fromNetwork: 'ethereum-sepolia',
                    toNetwork: 'base-sepolia', 
                    amount: '0.01',
                    recipient: '0x742d35Cc6634C0532925a3b8D402b1DeF8d87d87'
                };
                
                console.log('Executing test CCTP transfer...');
                window.executeRealCCTPTransfer(testCommand);
            } else {
                alert('executeRealCCTPTransfer not available - check if main.js loaded');
            }
        });
        
        setTimeout(() => {
            console.log('Window object keys:', Object.keys(window));
            console.log('CCTP function available:', typeof window.executeRealCCTPTransfer);
        }, 2000);
    </script>
</body>
</html>
