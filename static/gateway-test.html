<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Unlock Test</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 15px; margin: 10px; font-size: 16px; cursor: pointer; }
        .test-btn { background: #007bff; color: white; border: none; border-radius: 5px; }
        .unlock-btn { background: #28a745; color: white; border: none; border-radius: 5px; }
        #status { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #cce7ff; color: #004085; }
    </style>
</head>
<body>
    <h1>🔧 Gateway Unlock Test</h1>
    
    <div id="status" class="info">
        Ready to test unlock. Connect wallet first.
    </div>
    
    <button class="test-btn" onclick="testConnection()">
        🦊 Test Connection
    </button>
    
    <button class="unlock-btn" onclick="unlockFunds()">
        🔓 Unlock Reserved Funds
    </button>
    
    <button class="test-btn" onclick="checkBalance()">
        💰 Check Balance
    </button>

    <script>
        // Constants
        const GATEWAY_WALLET = '0x0077777d7EBA4688BDeF3E311b846F25870A19B9';
        const USDC_SEPOLIA = '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238';
        
        let provider = null;
        let userAccount = null;
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        async function testConnection() {
            updateStatus('Testing connection...', 'info');
            
            try {
                if (!window.ethereum) {
                    throw new Error('MetaMask not found');
                }
                
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (accounts.length === 0) {
                    throw new Error('No accounts found');
                }
                
                userAccount = accounts[0];
                provider = new ethers.providers.Web3Provider(window.ethereum);
                
                // Switch to Sepolia
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0xaa36a7' }]
                });
                
                updateStatus(`✅ Connected: ${userAccount}`, 'success');
                
            } catch (error) {
                updateStatus(`❌ Connection failed: ${error.message}`, 'error');
            }
        }
        
        async function checkBalance() {
            if (!provider || !userAccount) {
                updateStatus('Connect wallet first', 'error');
                return;
            }
            
            updateStatus('Checking balances...', 'info');
            
            try {
                // Check unified balance
                const response = await fetch('https://gateway-api-testnet.circle.com/v1/balances', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: 'USDC',
                        sources: [{ domain: 0, depositor: userAccount }]
                    })
                });
                
                const data = await response.json();
                const unifiedBalance = data.balances?.reduce((total, b) => total + parseFloat(b.balance || '0'), 0) || 0;
                
                // Check on-chain balance
                const tempProvider = new ethers.providers.JsonRpcProvider('https://ethereum-sepolia.rpc.subquery.network/public');
                const usdcContract = new ethers.Contract(USDC_SEPOLIA, [
                    'function balanceOf(address) view returns (uint256)'
                ], tempProvider);
                
                const onChainBalance = await usdcContract.balanceOf(GATEWAY_WALLET);
                const onChainFormatted = parseFloat(ethers.utils.formatUnits(onChainBalance, 6));
                
                const locked = onChainFormatted - unifiedBalance;
                
                updateStatus(`📊 Unified: ${unifiedBalance.toFixed(2)} USDC | On-Chain: ${onChainFormatted.toFixed(2)} USDC | Locked: ${locked.toFixed(2)} USDC`, 'info');
                
            } catch (error) {
                updateStatus(`❌ Balance check failed: ${error.message}`, 'error');
            }
        }
        
        async function unlockFunds() {
            if (!provider || !userAccount) {
                updateStatus('Connect wallet first', 'error');
                return;
            }
            
            if (!confirm('This will make a 0.001 USDC deposit using GatewayWallet.deposit() to unlock your reserved funds. Continue?')) {
                return;
            }
            
            updateStatus('Starting unlock process...', 'info');
            
            try {
                const signer = provider.getSigner();
                
                // USDC contract
                const usdcContract = new ethers.Contract(USDC_SEPOLIA, [
                    'function balanceOf(address) view returns (uint256)',
                    'function approve(address spender, uint256 amount) returns (bool)'
                ], signer);
                
                // Gateway contract  
                const gatewayContract = new ethers.Contract(GATEWAY_WALLET, [
                    'function deposit(uint256 amount, address token, uint32 destinationDomain, address destinationReceiver) payable'
                ], signer);
                
                const amount = ethers.utils.parseUnits('0.001', 6);
                
                // Check user balance
                const userBalance = await usdcContract.balanceOf(userAccount);
                if (userBalance.lt(amount)) {
                    throw new Error('You need at least 0.001 USDC in your wallet');
                }
                
                updateStatus('Step 1: Approving USDC...', 'info');
                const approveTx = await usdcContract.approve(GATEWAY_WALLET, amount);
                await approveTx.wait();
                
                updateStatus('Step 2: Making Gateway deposit...', 'info');
                const depositTx = await gatewayContract.deposit(
                    amount,
                    USDC_SEPOLIA,
                    0, // Sepolia domain
                    userAccount
                );
                
                updateStatus('Step 3: Waiting for confirmation...', 'info');
                const receipt = await depositTx.wait();
                
                if (receipt.status === 1) {
                    updateStatus(`✅ SUCCESS! Deposit completed. TX: ${depositTx.hash}. Wait 2-3 minutes then check balance again.`, 'success');
                } else {
                    throw new Error('Transaction failed');
                }
                
            } catch (error) {
                updateStatus(`❌ Unlock failed: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }
        
        // Auto-connect if available
        window.addEventListener('load', async () => {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) {
                    userAccount = accounts[0];
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    updateStatus(`Auto-connected: ${userAccount}`, 'success');
                }
            }
        });
    </script>
</body>
</html>
