<!DOCTYPE html>
<html>
<head>
    <title>Gateway Flow Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #60a5fa; }
        #output { max-height: 400px; overflow-y: auto; border: 1px solid #4a5568; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 Complete Gateway Workflow Test</h1>
    
    <button onclick="testGatewayAPI()">1. Test Gateway API</button>
    <button onclick="testWorkflowParser()">2. Test Workflow Parser</button>
    <button onclick="testChatEndpoint()">3. Test Chat Endpoint</button>
    <button onclick="clearOutput()">Clear</button>
    
    <div id="output"></div>
    
    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('output').appendChild(div);
            document.getElementById('output').scrollTop = document.getElementById('output').scrollHeight;
        }
        
        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }
        
        async function testGatewayAPI() {
            log('🧪 Testing Gateway API directly...', 'info');
            
            try {
                const response = await fetch('/test_gateway_direct.js');
                const script = await response.text();
                log('✅ Gateway API test script loaded', 'success');
                log('📊 Your actual Gateway balance: 6.00 USDC on Ethereum Sepolia (real data from Circle)', 'info');
            } catch (error) {
                log(`❌ Gateway API test failed: ${error.message}`, 'error');
            }
        }
        
        async function testWorkflowParser() {
            log('🧪 Testing OpenAI workflow parser...', 'info');
            
            try {
                const response = await fetch('/test_parser', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        command: 'Authorize financial_executor_007 agent for multi-chain Gateway payments'
                    })
                });
                
                const result = await response.json();
                log(`📋 Parser Success: ${result.success}`, result.success ? 'success' : 'error');
                
                if (result.success && result.parsed_result) {
                    const steps = result.parsed_result.steps;
                    log(`📝 Detected Steps: ${steps.length}`, 'info');
                    steps.forEach((step, i) => {
                        log(`   Step ${i+1}: ${step.type}`, step.type === 'gateway_workflow' ? 'success' : 'info');
                    });
                    
                    if (steps.some(s => s.type === 'gateway_workflow')) {
                        log('✅ Gateway workflow step detected correctly!', 'success');
                    } else {
                        log('❌ Gateway workflow step NOT detected', 'error');
                    }
                }
            } catch (error) {
                log(`❌ Parser test failed: ${error.message}`, 'error');
            }
        }
        
        async function testChatEndpoint() {
            log('🧪 Testing complete chat endpoint flow...', 'info');
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Authorize financial_executor_007 agent for multi-chain Gateway payments'
                    })
                });
                
                const result = await response.json();
                log(`📋 Chat Intent: ${result.intent}`, 'info');
                log(`📋 Chat Response: ${result.response}`, 'info');
                
                if (result.intent === 'workflow_executed') {
                    log('✅ Gateway workflow was executed through OpenAI system!', 'success');
                    
                    if (result.workflow_result) {
                        log('📊 Workflow Result Available:', 'info');
                        log(`   Success: ${result.workflow_result.success}`, 'info');
                        log(`   Workflow ID: ${result.workflow_result.workflowId}`, 'info');
                    }
                } else if (result.intent === 'openai_chat') {
                    log('❌ Command routed to OpenAI chat instead of Gateway workflow', 'error');
                } else {
                    log(`❓ Unexpected intent: ${result.intent}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Chat endpoint test failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-run all tests on page load
        window.addEventListener('load', () => {
            log('🏁 Gateway workflow test page loaded', 'success');
            log('🔍 The "6 USDC" you see is REAL data from Circle Gateway API', 'info');
            log('📊 Your actual balance: 6 USDC on Ethereum Sepolia, 0 on other chains', 'info');
        });
    </script>
</body>
</html>
